<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iKristoffer</title>
    <link rel="shortcut icon" href="https://filedn.eu/lSicfXqERmY83qHzlUAP4wm/iKristoffer/Logo/logo_favicon.png" type="image/png" />
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: rgb(49, 66, 40);
            background-image: url('https://filedn.eu/lSicfXqERmY83qHzlUAP4wm/iKristoffer/Images/bg2.png');
            background-size: cover;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            padding: 80px;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        h1 {
            color: #333;
            margin-top: 0px;
        }

        img {
            max-width: 30%;
            height: auto;
            cursor: pointer;
            
        }

        #mainImage {
            /* Your animation styles here */
            animation: mainLogoAnimation 2s ease-in-out forwards;
        }

        @keyframes mainLogoAnimation {
        from 
        {
          opacity: 0;
          transform: translateY(20px);
        }
        to 
        {
          opacity: 1;
          transform: translateY(0);
        }
        }

        /* Links section */
        .links-section {
            background-color: rgba(0, 0, 0, 0.15);
            padding: 20px;
            margin-top: center;
        }

        .links-header {
            color: #fff;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            margin-bottom: 10px;
        }

        .links-section .links-logos {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }

        .links-logo {
            width: 200px;
            margin: 5px;
            border: 0px;
            box-shadow: 0 0px 12px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            animation: linksLogoAnimations 2s ease-in-out forwards;
        }

        @keyframes linksLogoAnimations {
        from 
        {
          opacity: 0;
        }
        to 
        {
          opacity: 1;
        }
        }

        .links-logo:hover {
            box-shadow: 0 0px 12px rgba(0, 0, 0, 0.3);
            transform: scale(1.1);
            transition: transform 0.3s ease;
        }

        .links-item {
            text-align: center;
            font-weight: bold;
        }

        .links-text {
            display: block;
            margin-top: 5px;
            margin-bottom: 15px;
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
            font-size: 14px;
        }

        .links-text:hover {
            color: #FFA500;
        }

        /* About section */
        .about-section {
            background-color: #fff;
            padding: 40px;
            text-align: center;
        }

        .about-header {
            color: #333;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .about-text {
            color: #666;
            font-size: 16px;
            line-height: 1.6;
        }

        @media (max-width: 720px) {
            .container {
                padding: 10px;
            }

            img {
                max-width: 60%;
                margin-top: 25px;
                margin-bottom: 50px;
            }

            .links-section {
            background-color: rgba(0, 0, 0, 0.15);
            padding: 15px;
            margin-top: center;
        }

            .links-logos {
                flex-direction: row;
                justify-content: space-around;
            }

            .links-logo {
                max-width: 100px;
            }

            .about-section {
            background-color: #fff;
            padding: 20px;
            text-align: center;
        }

        }
    </style>

</head>

<body>
    <div class="container">
        <img id="mainImage" src="https://filedn.eu/lSicfXqERmY83qHzlUAP4wm/iKristoffer/Logo/logo_medium.png" alt="logo" onclick="changeImage()">
    </div>

    <!-- Links Section -->
    <div class="links-section">
        <div class="links-header">Links</div>
        <div class="links-logos">

            <div class="links-item">
                <a href="https://www.linkedin.com/in/kristofferbjohansen/" target="_blank" rel="noopener noreferrer">
                    <img class="links-logo" src="https://filedn.eu/lSicfXqERmY83qHzlUAP4wm/iKristoffer/Images/linkedin.png" alt="LinkedIn">
                    <span class="links-text">LinkedIn</span>
                </a>
            </div>

            <div class="links-item">
                <a href="https://www.allcapsgames.com" target="_blank" rel="noopener noreferrer">
                    <img class="links-logo" src="https://filedn.eu/lSicfXqERmY83qHzlUAP4wm/iKristoffer/Images/allcaps_logo.png" alt="ALLCAPS">
                    <span class="links-text">ALL CAPS Games</span>
                </a>
            </div>

        </div>
    </div>

    <!-- About Section -->
    <div class="about-section">
    <div class="about-header">About Me</div>
    <p id="typewriter-text" class="about-text">
        
    </p>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        var aboutText = document.getElementById("typewriter-text");

        var sentences = [
        "...",
        "Hmm...",
        "I should probably add something interesting to this section...",
        "I'll probably add something tomorrow...",
        "Well, let's see...",
        "Maybe I'll come up with a brilliant idea for this part...",
        "Wondering what to write here...",
        "This space needs a touch of creativity...",
        "A little mystery won't hurt, right?",
        "Adding a dash of intrigue for the curious minds...",
        "Still brainstorming...",
        "Just trying to fill up space...",
        "Well, here goes nothing!",
        "Let me think...",
        "What should I write here?",
        ];


        function typewriterEffect(sentence, callback) {
            var index = 0;

            function typeCharacter() {
                aboutText.textContent += sentence[index++];
                if (index < sentence.length) {
                    setTimeout(typeCharacter, 70); // Adjust the delay (50ms in this case)
                } else {
                    setTimeout(function () {
                        deleteCharacters(sentence, callback);
                    }, 1000); // Delay before starting deletion
                }
            }

            typeCharacter();
        }

        function deleteCharacters(sentence, callback) {
            var index = sentence.length;

            function deleteCharacter() {
                aboutText.textContent = sentence.substring(0, index--);
                if (index >= 0) {
                    setTimeout(deleteCharacter, 30); // Adjust the delay (50ms in this case)
                } else {
                    // Call the callback function when deletion is complete
                    if (callback) {
                        callback();
                    }
                }
            }

            deleteCharacter();
        }

        function switchSentence() {
            // Randomly select a sentence from the array
            var randomSentence = sentences[Math.floor(Math.random() * sentences.length)];

            // Call the typewriter effect for the new sentence
            typewriterEffect(randomSentence, switchSentence);
        }

        // Start the typewriter effect for the first sentence
        switchSentence();
    });
</script>

<script>
 function changeImage() {
    var body = document.body;
    
    // Define colors
    var color1 = 'rgb(139, 165, 100)'; // light green
    var color2 = 'rgb(49, 66, 40)';    // green

    var currentColor = window.getComputedStyle(body).getPropertyValue('background-color');

    // Toggle between two colors
    var newColor = (currentColor === color1) ? color2 : color1;

    body.style.transition = 'background-color 1s ease';
    body.style.backgroundColor = newColor;
}
</script>
