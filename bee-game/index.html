<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Havebi — a summer in a Danish backyard</title>
    <meta name="description" content="Fly a bee around a Danish backyard on a summer afternoon." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐝</text></svg>" />
    <script type="module" crossorigin src="./assets/index-DgAZBDds.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BjX8XSGn.css">
  </head>
  <body>
    <canvas id="viewport"></canvas>

    <div id="hud" class="hidden">
      <div id="nectar-panel">
        <span id="nectar-icon">🌼</span>
        <span id="nectar-count">0</span>
        <span class="label">nectar</span>
      </div>
      <div id="hint"></div>
    </div>

    <div id="start-screen">
      <div class="card">
        <h1>Havebi</h1>
        <p class="tagline">A summer afternoon in a Danish backyard.</p>
        <ul class="controls">
          <li class="key-only"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> fly</li>
          <li class="key-only"><kbd>Space</kbd> up &nbsp;·&nbsp; <kbd>Shift</kbd> down</li>
          <li class="key-only"><kbd>Mouse</kbd> look around</li>
          <li class="touch-only">Left stick to fly</li>
          <li class="touch-only">▲ ▼ for up and down</li>
          <li class="touch-only">Drag the view to look around</li>
          <li>Hover close to a flower to drink</li>
        </ul>
        <button id="start-button" type="button">Take off</button>
        <p class="footnote">Press <kbd>Esc</kbd> to release the mouse.</p>
      </div>
    </div>

  </body>
</html>
